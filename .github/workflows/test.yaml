name: test

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # The model is the reference the RTL is compared against, so it is run
      # first: if it does not hold its own error budget, nothing downstream
      # means anything.
      - name: Golden model self-test
        run: python3 model/cordic16.py

      # Word-exact RTL vs model. Runs iverilog directly (no docker), which is
      # what makes this job cheap enough to gate every push.
      - name: RTL vs model (word-exact)
        env:
          # sim_compare.py looks for the simulator on PATH; CI has no docker.
          SIM_NO_DOCKER: "1"
        run: python3 test/sim_compare.py --vectors 400

      - name: cocotb suite
        run: |
          cd test
          make clean
          make
          # `make` exits 0 even when a cocotb test fails, so the results file
          # is the authority.
          python -m cocotb_tools.check_results results.xml

      # The bring-up script is the thing a human runs on the demo board, so it
      # is tested here before any silicon exists: the clean virtual run must
      # pass, and the deliberately corrupted run must fail. Without the second
      # half a self-test that always prints PASS would look identical.
      - name: Bring-up self-test (virtual + injected defect)
        run: |
          python3 bringup/selftest.py --virtual
          ! python3 bringup/selftest.py --virtual --defect

      # The hardened netlist must still compute the right answer. DRC, LVS and
      # STA all compare the design against itself and pass for a design with
      # tied-off outputs; this is the check that fails when place-and-route
      # broke something. It runs the committed gds-build netlist if one is
      # present, and says so plainly when it is not, rather than passing
      # silently.
      - name: Structural and interface check on the netlist
        run: python3 pdk/verify-useful.py
        if: always()

      # Whether the committed tt_submission/ bundle is this design at all.
      # On 2026-11-28 it held a 187-cell stub whose uo_out was eight tie cells:
      # the bundle passed every self-comparison and shipped anyway. Check 1 of
      # verify-useful.py catches the same thing, but this one also cross-checks
      # the GDS placement count against the netlist so a mismatched pair cannot
      # be packed. It runs separately so the failure names the bundle.
      - name: Committed bundle is the design, not a stub
        run: bash pdk/check-bundle.sh
        if: always()

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: Upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
