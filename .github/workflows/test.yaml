name: test

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # The model is the reference the RTL is compared against, so it is run
      # first: if it does not hold its own error budget, nothing downstream
      # means anything.
      - name: Golden model self-test
        run: python3 model/cordic16.py

      # Word-exact RTL vs model. Runs iverilog directly (no docker), which is
      # what makes this job cheap enough to gate every push.
      - name: RTL vs model (word-exact)
        env:
          # sim_compare.py looks for the simulator on PATH; CI has no docker.
          SIM_NO_DOCKER: "1"
        run: python3 test/sim_compare.py --vectors 400

      - name: cocotb suite
        run: |
          cd test
          make clean
          make
          # `make` exits 0 even when a cocotb test fails, so the results file
          # is the authority.
          python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: Upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
